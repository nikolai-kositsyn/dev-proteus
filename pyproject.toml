[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-proteus"
version = "0.1.0"
description = "Universal Linux Peripheral Emulator with LD_PRELOAD hook support"
readme = "README.md"
authors = [
    {name = "Nikolai Kositsyn", email = "nikolai.kositsyn@gmail.com"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/nikolai-kositsyn/dev-proteus"
BugTracker = "https://github.com/nikolai-kositsyn/dev-proteus/issues"

[project.scripts]
dev-proteus = "dev_proteus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dev_proteus*"]

[tool.setuptools.package-data]
dev_proteus = ["py.typed"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ['py37']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true